<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Страница не найдена — Анатолий Осокин</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0A0705">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant:wght@600;700&family=Montserrat:wght@400;600&display=swap">
  <style>
    :root { --bg: #0A0705; --gold: #E0A94A; --gold-bright: #FFD58A; --gold-pale: #FFE9BC; --gold-deep: #9C6A22; --muted: #B8A27E; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; display: grid; place-items: center; padding: 1rem; text-align: center;
      background: radial-gradient(ellipse 60% 50% at 50% 30%, rgba(224,169,74,.12), transparent 70%), var(--bg);
      color: var(--muted); font-family: "Montserrat", system-ui, sans-serif;
    }
    main { display: grid; gap: 1.25rem; justify-items: center; }
    .num {
      font-family: "Cormorant", Georgia, serif; font-weight: 700; font-size: clamp(5rem, 22vw, 9rem); line-height: .9;
      font-variant-numeric: lining-nums;
      background: linear-gradient(180deg, var(--gold-pale), var(--gold-bright) 40%, var(--gold) 75%, var(--gold-deep));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    h1 { margin: 0; font-family: "Cormorant", Georgia, serif; font-weight: 600; font-size: 1.8rem; color: var(--gold-pale); }
    a {
      display: inline-flex; padding: .9rem 1.6rem; border-radius: 999px; text-decoration: none; font-weight: 600; color: #1A1206;
      background: linear-gradient(135deg, var(--gold-pale), var(--gold) 55%, var(--gold-deep)); border: 1px solid var(--gold-bright);
    }
  </style>
</head>
<body>
  <main>
    <div class="num">404</div>
    <h1>Такой страницы нет</h1>
    <a href="/">На главную</a>
  </main>
</body>
</html>
